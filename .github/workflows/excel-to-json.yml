name: Excel to Wired Policy JSON

on:
  push:
    paths:
      - '**/policy.xlsx'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas openpyxl

      - name: Convert Excel to JSON
        run: |
          python << 'EOF'
          import pandas as pd, json, os

          excel_path = 'data/wired/policy.xlsx'
          json_path = 'data/wired/policy.json'

          df = pd.read_excel(excel_path)
          df = df[['KEY','정책금액(만원)']].dropna()

          with open(json_path,'w',encoding='utf-8') as f:
              json.dump(df.to_dict(orient='records'), f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/wired/policy.json
          git diff --cached --quiet || git commit -m "auto: update wired policy json"
          git push
