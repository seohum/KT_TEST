<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>유선 정책 계산기</title>
<script src="js/wiredPolicy.js"></script>
</head>
<body>
<h2>유선 정책</h2>

<div>
  <button onclick="selectProduct('MI')">M+I</button>
  <button onclick="selectProduct('IT')">I+T</button>
  <button onclick="selectProduct('MIT')">M+I+T</button>
</div>

<div>
  <label><input type="checkbox" id="onestop"> 원스톱</label>
  <label><input type="checkbox" id="genie3"> 기가지니3</label>
</div>

<div>
  <button onclick="calc()">계산</button>
</div>

<p id="result"></p>

<script>
let productCode = "MI";

function selectProduct(code){
  productCode = code;
}

function calc(){
  const onestop = document.getElementById("onestop").checked;
  const genie3 = document.getElementById("genie3").checked;
  const key = makeWiredKey(productCode,onestop,genie3);
  const price = getWiredPrice(key);
  document.getElementById("result").innerText = "정책금액: " + price + "만원";
}
</script>
</body>
</html>
